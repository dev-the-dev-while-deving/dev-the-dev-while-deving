name: 3D contribution skyline

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f login="${{ github.repository_owner }}" -f query='
            query($login: String!) { user(login: $login) { contributionsCollection { contributionCalendar {
              totalContributions
              weeks { contributionDays { date contributionCount contributionLevel weekday } }
            } } } }' > "$RUNNER_TEMP/calendar.json"
      - name: Draw the skyline and the snake
        run: python3 tools/skyline3d.py "$RUNNER_TEMP/calendar.json" assets/
      - name: Commit if changed
        run: |
          git add assets/skyline-light.svg assets/skyline-dark.svg
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update 3D contribution skyline"
          git pull --rebase
          git push
