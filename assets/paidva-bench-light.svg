<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Paidva-Bench, flagship benchmark suite: 500 real-world research tasks across 8 domains and 6 workflows with Wilson 95% CIs and exact McNemar tests."><title>Paidva-Bench, flagship benchmark suite: 500 real-world research tasks across 8 domains and 6 workflows.</title><rect width="1200" height="380" rx="48" fill="#EADDFF"/><rect x="48" y="44" width="184" height="32" rx="16" fill="#4F378B"/><text x="140" y="65" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">FLAGSHIP BENCHMARK</text><text x="1152" y="66" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#21005D" text-anchor="end" letter-spacing="0">Python · Apache-2.0</text><text x="48" y="150" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="60" font-weight="900" fill="#21005D" text-anchor="start" letter-spacing="-1">Paidva-Bench</text><text x="48" y="200" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#21005D" text-anchor="start" letter-spacing="0">Real-world AI research, tested with real stats.</text><text x="48" y="230" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#4F378B" text-anchor="start" letter-spacing="0">500 public tasks across 8 domains &amp; 6 workflows,</text><text x="48" y="260" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#4F378B" text-anchor="start" letter-spacing="0">plus a bridge to SimpleQA, FRAMES &amp; SciFact.</text><text x="48" y="330" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#21005D" text-anchor="start" letter-spacing="0">Wilson 95% CI (±3.8 pts) · Cluster SE · Exact McNemar p</text><rect x="640" y="92" width="512" height="256" rx="28" fill="#111118"/><text x="668" y="134" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#ECE6F0" text-anchor="start" letter-spacing="0">$ python3 bench.py report results/*.jsonl</text><rect x="668" y="166" width="92" height="24" rx="6" fill="#80DEEA"/><text x="714" y="183" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#111118" text-anchor="middle" letter-spacing="0">data</text><text x="774" y="183" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#ECE6F0" text-anchor="start" letter-spacing="0">120 messy CSV &amp; Simpson traps ✓</text><rect x="668" y="206" width="92" height="24" rx="6" fill="#B7F397"/><text x="714" y="223" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#111118" text-anchor="middle" letter-spacing="0">docs</text><text x="774" y="223" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#ECE6F0" text-anchor="start" letter-spacing="0">100 multi-file contradictions ✓</text><rect x="668" y="246" width="92" height="24" rx="6" fill="#F2B8B5"/><text x="714" y="263" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#111118" text-anchor="middle" letter-spacing="0">abstain</text><text x="774" y="263" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#ECE6F0" text-anchor="start" letter-spacing="0">70 false-premise &amp; null CSVs ✓</text><text x="668" y="30