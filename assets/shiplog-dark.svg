<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Animated git graph: commits on main, a feature branch, and a merge" xmlns:c2pa="http://c2pa.org/manifest"><title>Animated git graph: commits on main, a feature branch, and a merge</title><style>
.ln{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 8s ease-in-out infinite}
.br{stroke-dasharray:600;stroke-dashoffset:600;animation:draw2 8s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:1200}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-1200}}
@keyframes draw2{0%,15%{stroke-dashoffset:600}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
.n{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:node 8s cubic-bezier(.34,1.56,.64,1) infinite}
@keyframes node{0%{transform:scale(0)}8%,85%{transform:scale(1)}95%,100%{transform:scale(0)}}
@media (prefers-reduced-motion:reduce){.ln,.br{animation:none;stroke-dashoffset:0}.n{animation:none;transform:none}}
</style><rect width="1200" height="280" rx="48" fill="#205107"/><text x="48" y="82" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="900" fill="#B7F397" text-anchor="start" letter-spacing="-1">Ship log</text><text x="1152" y="78" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#B7F397" text-anchor="end" letter-spacing="0">commit · branch · merge · repeat</text><path class="ln" d="M60 190 H1140" stroke="#9CD67D" stroke-width="10" stroke-linecap="round" fill="none"/><path class="br" d="M300 190 C380 190 380 130 460 130 H700 C780 130 780 190 860 190" stroke="#A0CFD0" stroke-width="10" stroke-linecap="round" fill="none"/><g class="n" style="animation-delay:0.00s"><circle cx="100" cy="190" r="15" fill="#9CD67D"/><circle cx="100" cy="190" r="6" fill="#205107"/></g><g class="n" style="animation-delay:0.38s"><circle cx="220" cy="190" r="15" fill="#9CD67D"/><circle cx="220" cy="190" r="6" fill="#205107"/></g><g class="n" style="animation-delay:0.76s"><circle cx="300" cy="190" r="15" fill="#9CD67D"/><circle cx="300" cy="190" r="6" fill="#205107"/></g><g class="n" style="animation-delay:1.14s"><circle cx="520" cy="130" r="15" fill="#A0CFD0"/><circle cx="520" cy="130" r="6" fill="#205107"/></g><g class="n" style="animation-delay:1.52s"><circle cx="560" cy="190" r="15" fill="#9CD67D"/><circle cx="560" cy="190" r="6" fill="#205107"/></g><g class="n" style="animation-delay:1.90s"><circle cx="620" cy="130" r="15" fill="#A0CFD0"/><circle cx="620" cy="130" r="6" fill="#205107"/></g><g class="n" style="animation-delay:2.28s"><circle cx="860" cy="190" r="22" fill="#9CD67D"/><circle cx="860" cy="190" r="9" fill="#205107"/></g><g class="n" style="animation-delay:2.66s"><circle cx="980" cy="190" r="15" fill="#9CD67D"/><circle cx="980" cy="190" r="6" fill="#205107"/></g><g class="n" style="animation-delay:3.04s"><circle cx="1100" cy="190" r="15" fill="#9CD67D"/><circle cx="1100" cy="190" r="6" fill="#205107"/></g><text x="60" y="240" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#B7F397" text-anchor="start" letter-spacing="0">main</text><text x="470" y="104" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#B7F397" text-anchor="start" letter-spacing="0">feat/*</text><text x="860" y="240" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#B7F397" text-anchor="middle" letter-spacing="0">merge</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>