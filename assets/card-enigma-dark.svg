<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" role="img" aria-label="ENIGMA: Bayesian MPC agent for safe highway driving.">
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: reduce) { animate { display: none; } }
  </style>
  <rect width="580" height="220" fill="#10110e"/>
  <path d="M14 14h20M14 14v20M566 14h-20M566 14v20M14 206h20M14 206v-20M566 206h-20M566 206v-20" fill="none" stroke="#f4f1ea" stroke-width="1.5"/>
