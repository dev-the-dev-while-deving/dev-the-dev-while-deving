    .name { font-size: 92px; font-weight: 700; letter-spacing: -3px; }
    .kicker { font-size: 13px; letter-spacing: 4px; }
    .small { font-size: 14px; letter-spacing: 6px; }
    .role { font-size: 20px; }
    .label { font-size: 14px; letter-spacing: 3px; }
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { display: none !important; }
    }
