<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Paidva, my flagship: a research agent that shows its work. Tagged claims, sandboxed maths, verified citations, ranked confidence. Rust, V1."><title>Paidva, my flagship: a research agent that shows its work. Tagged claims, sandboxed maths, verified citations, ranked confidence. Rust, V1.</title><rect width="1200" height="380" rx="48" fill="#FFDDB3"/><rect x="48" y="44" width="104" height="32" rx="16" fill="#7C5800"/><text x="100" y="65" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">FLAGSHIP</text><text x="1152" y="66" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#291800" text-anchor="end" letter-spacing="0">Rust · V1</text><text x="48" y="150" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="60" font-weight="900" fill="#291800" text-anchor="start" letter-spacing="-1">Paidva</text><text x="48" y="200" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#291800" text-anchor="start" letter-spacing="0">A research agent that shows its work.</text><text x="48" y="230" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#291800" text-anchor="start" letter-spacing="0">Every claim tagged, every number computed,</text><text x="48" y="260" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#291800" text-anchor="start" letter-spacing="0">every citation checked word for word.</text><text x="48" y="330" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#291800" text-anchor="start" letter-spacing="0">0 dead citations · 65% → 87% accuracy · next: self-improving</text><rect x="640" y="92" width="512" height="256" rx="28" fill="#121410"/><text x="668" y="134" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#E2E4D9" text-anchor="start" letter-spacing="0">$ paidva ask "P(disease | positive)?"</text><rect x="668" y="166" width="92" height="24" rx="6" fill="#A0CFD0"/><text x="714" y="183" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#121410" text-anchor="middle" letter-spacing="0">observed</text><text x="774" y="183" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#E2E4D9" text-anchor="start" letter-spacing="0">P = 0.2687 · sandbox ✓ sim ✓</text><rect x="668" y="206" width="92" height="24" rx="6" fill="#B7F397"/><text x="714" y="223" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#121410" text-anchor="middle" letter-spacing="0">sourced</text><text x="774" y="223" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#E2E4D9" text-anchor="start" letter-spacing="0">quote matched verbatim ✓</text><rect x="668" y="246" width="92" height="24" rx="6" fill="#D0BCFF"/><text x="714" y="263" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#121410" text-anchor="middle" letter-spacing="0">inferred</text><text x="774" y="263" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#E2E4D9" text-anchor="start" letter-spacing="0">follows from claims 1, 2</text><text x="668" y="306" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#8D9286" text-anchor="start" letter-spacing="0">confidence</text><rect x="774" y="292" width="18" height="18" rx="4" fill="#FFB95C"/><rect x="798" y="292" width="18" height="18" rx="4" fill="#FFB95C"/><rect x="822" y="292" width="18" height="18" rx="4" fill="#FFB95C"/><rect x="846" y="292" width="18" height="18" rx="4" fill="#FFB95C"/><rect x="870" y="292" width="18" height="18" rx="4" fill="#FFB95C"/><rect x="894" y="292" width="18" height="18" rx="4" fill="#FFB95C"/><rect x="918" y="292" width="18" height="18" rx="4" fill="#FFB95C"/><rect x="942" y="292" width="18" height="18" rx="4" fill="#FFB95C"/><rect x="966" y="292" width="18" height="18" rx="4" fill="#FFB95C"/><rect x="990" y="292" width="18" height="18" rx="4" fill="#3A3D35"/><text x="1022" y="306" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#FFB95C" text-anchor="start" letter-spacing="0">0.86</text><text x="668" y="332" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#8D9286" text-anchor="start" letter-spacing="0">── /why shows the full trace ──</text></svg>