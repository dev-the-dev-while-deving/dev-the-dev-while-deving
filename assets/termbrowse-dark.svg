<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="termbrowse — reads the web from a terminal (Rust)" xmlns:c2pa="http://c2pa.org/manifest"><title>termbrowse — reads the web from a terminal (Rust)</title><rect width="1200" height="380" rx="48" fill="#4F378B"/><rect x="48" y="44" width="64" height="32" rx="16.0" fill="#D0BCFF"/><text x="80.0" y="65.04" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#381E72" text-anchor="middle" letter-spacing="0">Rust</text><text x="1152" y="66" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#EADDFF" text-anchor="end" letter-spacing="0">Featured</text><text x="48" y="150" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="60" font-weight="900" fill="#EADDFF" text-anchor="start" letter-spacing="-1">termbrowse</text><text x="48" y="200" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#EADDFF" text-anchor="start" letter-spacing="0">Reads the web from a terminal. Fetches pages,</text><text x="48" y="230" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#EADDFF" text-anchor="start" letter-spacing="0">drops the JavaScript and renders the rest</text><text x="48" y="260" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#EADDFF" text-anchor="start" letter-spacing="0">in 256 colors.</text><rect x="640" y="112" width="512" height="220" rx="28" fill="#17151c"/><text x="668" y="160" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#e6e0e9" text-anchor="start" letter-spacing="0">$ termbrowse news.ycombinator.com</text><text x="668" y="194" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#ffb59c" text-anchor="start" letter-spacing="0">▍ Hacker News</text><text x="668" y="228" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#cdbdff" text-anchor="start" letter-spacing="0">1. Show HN: a browser that fits in 2 MB</text><text x="668" y="262" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#8fd8d0" text-anchor="start" letter-spacing="0">2. Why local-first software wins</text><text x="668" y="296" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#938f99" text-anchor="start" letter-spacing="0">── 0 scripts run · 256 colors ──</text><text x="668" y="160" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="600" fill="#9be37c" text-anchor="start" letter-spacing="0">$</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>